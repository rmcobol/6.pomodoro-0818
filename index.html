<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>춘천시 넥스텝 컴퓨터 학원</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <main class="pomodoro">
    <button class="settings-btn" type="button" aria-label="설정" onclick="location.href='settings.html'">⚙</button>

    <h1>Pomodoro</h1>

    <div class="time-display" id="time-display">25:00</div>

    <div class="controls">
      <button class="btn btn-start" type="button" onclick="startTimer()">start</button>
      <button class="btn btn-stop" type="button" onclick="stopTimer()">stop</button>
      <button class="btn btn-reset" type="button" onclick="resetTimer()">clear</button>
    </div>
  </main>

  <script src="index.js"></script>
</body>

</html>
